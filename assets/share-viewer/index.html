<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dial shared session</title><style>body{font:15px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;background:#101318;color:#e5e7eb}article{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2029;padding:1rem;margin:.5rem 0;border-radius:6px}.error{color:#fca5a5}</style><h1>Shared session</h1><p id=status>Decrypting in this browser…</p><main id=messages></main><script type=module>
const status=document.querySelector('#status'),out=document.querySelector('#messages');
const fail=e=>{status.className='error';status.textContent=String(e)};
try{if(!location.hash)throw Error('Missing decryption key fragment.');const keyBytes=Uint8Array.from(atob(location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(location.hash.length/4)*4,'=')),c=>c.charCodeAt(0));if(keyBytes.length!==32)throw Error('Invalid decryption key.');const key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['decrypt']);const response=await fetch(location.pathname,{cache:'no-store'});if(!response.ok)throw Error(`Unable to download encrypted session (${response.status}).`);const bytes=new Uint8Array(await response.arrayBuffer());const magic=new TextDecoder().decode(bytes.slice(0,8));if(magic!=='DIALSHR1')throw Error('Invalid encrypted session format.');const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(8,20),additionalData:new TextEncoder().encode('DIALSHR1')},key,bytes.slice(20));const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));const data=JSON.parse(await new Response(stream).text());const list=Array.isArray(data)?data:(data.messages||[]);for(const entry of list){const article=document.createElement('article');article.textContent=JSON.stringify(entry,null,2);out.append(article);}status.textContent=`Decrypted locally · ${list.length} records · no key sent to the server.`;}catch(error){fail(error.message||error)}
</script></html>
