# cargo-nextest configuration (`make test-nextest`). Tests are not retried: a flaky test is a bug
# to fix, not to hide. Slow tests are reported, and a hung test is terminated instead of stalling
# the run indefinitely.
[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
status-level = "fail"
final-status-level = "slow"

# CI-style runs: same policy, plus JUnit output for test reporting.
[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
