[package]
name = "dial-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dial-build-info.workspace = true
dial-core.workspace = true
dial-llm.workspace = true
dial-storage.workspace = true
anyhow.workspace = true
ast-grep-core.workspace = true
ast-grep-language.workspace = true
base64.workspace = true
brush-builtins = { workspace = true, optional = true }
brush-core = { workspace = true, optional = true }
encoding_rs.workspace = true
fancy-regex.workspace = true
flate2.workspace = true
fs2.workspace = true
futures.workspace = true
globset.workspace = true
ignore.workspace = true
image.workspace = true
jaq-core.workspace = true
jaq-json.workspace = true
jaq-std.workspace = true
libc.workspace = true
parking_lot.workspace = true
quick-xml.workspace = true
rand.workspace = true
regex.workspace = true
ring.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
similar.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tungstenite.workspace = true
unicode-normalization.workspace = true
ureq.workspace = true
url.workspace = true
vt100.workspace = true
zip.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true }
windows-sys.workspace = true

[dev-dependencies]
dial-core = { workspace = true, features = ["test-support"] }
dial-llm = { workspace = true, features = ["test-support"] }

[features]
default = ["voice", "embedded-shell"]
voice = ["dep:cpal"]
# Built-in POSIX shell for the `bash` tool (`shell.backend = "embedded"`); brush shell language plus coreutils builtins.
embedded-shell = ["dep:brush-core", "dep:brush-builtins"]
# Test helpers used by other crates' tests (`#[cfg(test)]` items compiled only for this crate otherwise).
test-support = []
