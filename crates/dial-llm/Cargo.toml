[package]
name = "dial-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dial-core.workspace = true
anyhow.workspace = true
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
base64.workspace = true
crc32fast.workspace = true
flate2.workspace = true
fs2.workspace = true
httpdate.workspace = true
image.workspace = true
libc.workspace = true
parking_lot.workspace = true
rand.workspace = true
regex.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tungstenite.workspace = true
ureq.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[features]
default = ["aws"]
# AWS credential chain (env, profiles, SSO, process, web identity, ECS/IMDS) and SigV4 for Bedrock.
# Bearer-key Bedrock works without it; SigV4 without it fails with a clear error.
aws = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sigv4", "dep:aws-smithy-http-client"]
# Test helpers used by other crates' tests (`#[cfg(test)]` items compiled only for this crate otherwise).
test-support = []
