[package]
name = "dial"
version.workspace = true
edition.workspace = true
description = "Local, gated model and harness improvement on Apple Silicon"
license.workspace = true

[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.9"
edition = "2024"
license = "MIT"

# Every dependency version is declared once here. Members opt in with `workspace = true` and keep
# `optional` and target selection locally. Workspace crates (`crates/dial-*`) are path dependencies
# declared here too; a crate with optional features is added with `default-features = false` and
# the root forwards its features.
[workspace.dependencies]
dial-build-info = { path = "crates/dial-build-info" }
dial-core = { path = "crates/dial-core" }
dial-llm = { path = "crates/dial-llm", default-features = false }
dial-storage = { path = "crates/dial-storage" }
anyhow = "1"
vt100 = "0.15"
thiserror = "2"
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
fs2 = "0.4"
rand = "0.9"
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
base64 = "0.23"
encoding_rs = "0.8"
tempfile = "3"
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
semver = "1"
sha1 = "0.10"
ring = "0.17"
# The SDK default HTTPS client would pull aws-lc-rs (a C build); its HTTP client is built on ring instead.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "credentials-process", "sso"] }
aws-credential-types = "1"
aws-sigv4 = "1"
aws-smithy-http-client = { version = "1.5", default-features = false, features = ["rustls-ring", "rt-tokio"] }
crc32fast = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
toml = "0.9"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.12", default-features = false }
quick-xml = "0.41"
regex = "1.13.1"
fancy-regex = "0.16"
ast-grep-core = "0.45.3"
ast-grep-language = "0.45.3"
ignore = "0.4.33"
globset = "0.4"
httpdate = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
parking_lot = "0.12"
similar = { version = "2.7", default-features = false, features = ["text"] }
shlex = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
fontdue = "0.9"
png = "0.18"
notify = "8"
jaq-core = "3.1.1"
jaq-std = "3.0.3"
jaq-json = "2.0.3"
serde_norway = "0.9"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
flume = "0.12"
futures = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh32"] }
brush-core = "0.5"
brush-builtins = "0.2"
# Desktop control (computer tool): platform crates pinned to known-good versions.
ashpd = { version = "=0.11.1", default-features = false, features = ["tokio"] }
atspi = { version = "=0.30.0", features = ["tokio", "zbus"] }
pipewire = "=0.9.2"
reis = { version = "=0.5.0", features = ["tokio"] }
x11rb = { version = "=0.13.2", features = ["randr", "xinput", "xtest"] }
xkeysym = "=0.2.1"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
xcap = { version = "=0.9.6", default-features = false }
cpal = "0.16"
block2 = "=0.6.2"
core-graphics = { version = "0.25", features = ["highsierra"] }
foreign-types = "=0.5.0"
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-application-services = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-foundation = "=0.3.2"
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_Storage_ProjectedFileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }
enigo = { version = "=0.6.1", default-features = false }
uiautomation = "=0.25.1"
winreg = "0.56"

[features]
default = ["aws", "voice", "embedded-shell", "desktop"]
# AWS credential chain (env, profiles, SSO, process, web identity, ECS/IMDS) and SigV4 for Bedrock.
# Bearer-key Bedrock works without it; SigV4 without it fails with a clear error.
aws = ["dial-llm/aws"]
voice = ["dep:cpal"]
# Built-in POSIX shell for the `bash` tool (`shell.backend = "embedded"`); brush shell language plus coreutils builtins.
embedded-shell = ["dep:brush-core", "dep:brush-builtins"]
# Native desktop capture, accessibility and input. Browser automation is independent.
desktop = [
    "dep:xcap", "dep:ashpd", "dep:atspi", "dep:reis", "dep:x11rb", "dep:xkeysym", "dep:zbus",
    "dep:block2", "dep:core-graphics", "dep:foreign-types", "dep:objc2", "dep:objc2-app-kit",
    "dep:objc2-application-services", "dep:objc2-core-foundation", "dep:objc2-core-graphics",
    "dep:objc2-foundation", "dep:windows", "dep:enigo", "dep:uiautomation",
]
# Linux Wayland screencast (PipeWire); off by default.
wayland-pipewire = ["desktop", "dep:pipewire"]


[dev-dependencies]
dial-core = { workspace = true, features = ["test-support"] }
dial-llm = { workspace = true, features = ["test-support"] }
dial-storage = { workspace = true, features = ["test-support"] }

