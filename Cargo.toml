# Local builds and tests: line tables for our crate (panics and backtraces keep file:line), no debug
# info for dependencies. Full debug info made the test binary ~260 MB and dominated link time.
# For a debugger session use `cargo build --profile profiling` or set `CARGO_PROFILE_DEV_DEBUG=true`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Shipped binaries: thin cross-crate LTO, no symbols. Fat LTO with one codegen unit took
# 14-43 min per release target for no measurable gain in an I/O-bound agent; thin LTO keeps
# cross-crate inlining and compiles in parallel.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true

# Optimized dependencies without whole-program LTO; keep shipping release unchanged.
# Retain dependency settings/cache while compiling Dial itself more cheaply below.
[profile.local]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true

# Dial is a large, frequently edited crate. Favor parallel codegen and faster optimization
# here without slowing parsing, image processing or other dependency hot paths.
[profile.local.package.dial]
opt-level = 1
codegen-units = 64

[profile.local.package.dial-build-info]
opt-level = 1
codegen-units = 64

[profile.local.package.dial-core]
opt-level = 1
codegen-units = 64

[profile.local.package.dial-llm]
opt-level = 1
codegen-units = 64

[profile.local.package.dial-storage]
opt-level = 1
codegen-units = 64

# CI builds/tests: unoptimized, no debuginfo, no incremental cache (smaller, cacheable target dirs).
[profile.ci]
inherits = "dev"
debug = false
incremental = false

# Release-equivalent code with symbols for perf/Instruments/samply: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
