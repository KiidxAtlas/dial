[package]
name = "dial"
version = "0.1.2"
edition = "2024"
description = "Cross-platform coding agent with gated local model and harness improvement"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
rand = "0.9"
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
rustls = { version = "0.23", default-features = false }
base64 = "0.23"
tempfile = "3"
serde_json = "1"
sha2 = "0.10"
ring = "0.17"
toml = "0.9"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.12", default-features = false }
regex = "1.13.1"
ast-grep-core = "0.45.3"
ast-grep-language = "0.45.3"
ignore = "0.4.33"
globset = "0.4"
httpdate = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
parking_lot = "0.12"
similar = { version = "2.7", default-features = false, features = ["text"] }
shlex = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
url = "2.5.8"
hostname = "0.4.2"
open = "5"

[dev-dependencies]
vt100 = "0.15"

[target."cfg(windows)".dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Memory"] }
winreg = "0.55"
