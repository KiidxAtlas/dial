# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). CI runs
# `cargo deny check advisories licenses bans sources`.

[graph]
# Check the dependency graph of every platform Dial ships for, not only the CI host.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities and unsoundness always fail. Unmaintained notices fail only for crates Dial
# depends on directly; transitive ones are reported by the advisory database upstream.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
# Each ignored advisory needs an inline justification; remove it once the dependency is upgraded.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# The allow-list anticipates permissive licenses new dependencies commonly use.
unused-allowed-license = "allow"
# Licenses compatible with distributing Dial under MIT. MPL-2.0 is file-level copyleft:
# modified MPL dependency files retain their license and source availability obligations.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

# brush-core's terminal database dependency uses WTFPL v2. The reviewed license permits
# unrestricted copying, distribution and modification; keep this allowance package-specific.
[[licenses.exceptions]]
name = "terminfo"
version = "=0.9.0"
allow = ["WTFPL"]

[bans]
# Duplicate major versions are common in the ecosystem; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
