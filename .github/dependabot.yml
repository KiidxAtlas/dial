version: 2
# Minor and patch updates are grouped into one PR per ecosystem so a weekly update wave starts
# a few CI runs instead of one per dependency; each CI run holds three macOS jobs, which delays
# release-bound main runs. Major updates and security updates still open individual PRs.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    groups:
      pip:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
