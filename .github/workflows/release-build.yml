name: Release candidates

on:
  workflow_call:
    inputs:
      tag:
        description: Validated stable release tag matching the checkout
        required: true
        type: string
      ref:
        description: Commit to build; candidates record its tree, which a release must match
        required: true
        type: string
      epoch:
        description: Source commit timestamp
        required: true
        type: string

permissions:
  contents: read

jobs:
  identity:
    name: Record unsigned candidate identity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate public keys and record identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.lock
          python3 scripts/release-policy.py check "$RELEASE_TAG"
          python3 scripts/release-policy.py keys
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('policy', 'scripts/release-policy.py')
          policy = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(policy)
          import subprocess
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          identity = policy.candidate_identity(git('rev-parse', 'HEAD'), git('rev-parse', 'HEAD^{tree}'))
          path = Path('candidate.json')
          path.write_text(json.dumps(identity) + '\n', encoding='utf-8')
          assert json.loads(path.read_text()) == identity
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-identity
          path: candidate.json
          if-no-files-found: error

  build:
    name: Package ${{ matrix.target }}
    needs: identity
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_DATE_EPOCH: ${{ inputs.epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          # Cross-compiled on Apple Silicon: the Intel runner's build took ~24 min and set the
          # candidate critical path. The smoke test runs the binary under Rosetta; CI does not
          # run the test suite on Intel hardware.
          - os: macos-15
            target: x86_64-apple-darwin
            cache-suffix: -arm64-host
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ github.event_name == 'push' && matrix.os == 'macos-15' && vars.DIAL_MACOS_RUNNER || matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap musl-tools
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Ensure Rosetta for the x86_64 macOS smoke test
        if: matrix.target == 'x86_64-apple-darwin'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Select musl C compiler
        if: contains(matrix.target, '-musl')
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: echo "CC_${RELEASE_TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}${{ matrix.cache-suffix }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
        run: cargo build --release --locked -p dial --target "${{ matrix.target }}"
      - name: Package and smoke-test outside the checkout
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="dial-${RELEASE_TAG}-${RELEASE_TARGET}"
          mkdir -p "dist/$package"
          install -m 755 "target/$RELEASE_TARGET/release/dial" "dist/$package/dial"
          cp LICENSE README.md THIRD_PARTY_NOTICES crates/dial-agent/src/agent/compact/snapcompact/fonts/Silver.LICENSE crates/dial-agent/src/agent/compact/snapcompact/fonts/Unscii.LICENSE "dist/$package/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          smoke="$(mktemp -d "${RUNNER_TEMP:-$PWD/dist}/dial-smoke.XXXXXX")"
          trap 'rm -rf "$smoke"' EXIT
          tar -xzf "dist/$package.tar.gz" -C "$smoke"
          python3 scripts/check-artifact.py --dial "$smoke/$package/dial" --target "$RELEASE_TARGET"
          cd "$smoke/$package"
          ./dial --version | awk 'NR==1 {print $1, $2}' | grep -Fx "dial ${RELEASE_TAG#v}"
          ./dial --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  windows-build:
    name: Build and package ${{ matrix.target }}
    needs: identity
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_DATE_EPOCH: ${{ inputs.epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ github.event_name == 'push' && matrix.os == 'windows-2025' && vars.DIAL_WINDOWS_RUNNER || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Install pinned Rust
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release binary
        env:
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
          # Ship the C runtime inside dial.exe: users should not need the VC++ redist.
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo build --release --locked -p dial --target "${{ matrix.target }}"
      - name: Package and smoke-test outside the checkout
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $package = "dial-$env:RELEASE_TAG-$env:RELEASE_TARGET"
          $dir = "dist/$package"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/$env:RELEASE_TARGET/release/dial.exe" "$dir/dial.exe"
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES, crates/dial-agent/src/agent/compact/snapcompact/fonts/Silver.LICENSE, crates/dial-agent/src/agent/compact/snapcompact/fonts/Unscii.LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$package.zip"
          $expected = "$env:RELEASE_TAG".Substring(1)
          # Capture all output first: piping into `Select-Object -First 1` stops the native
          # command early and leaves $LASTEXITCODE unset, which failed this check.
          $smoke = Join-Path $env:RUNNER_TEMP ('dial-smoke-' + [Guid]::NewGuid().ToString('N'))
          try {
            Expand-Archive -LiteralPath "dist/$package.zip" -DestinationPath $smoke
            Push-Location (Join-Path $smoke $package)
            try {
              $output = & ./dial.exe --version
              $code = $LASTEXITCODE
              $version = @($output)[0]
              if ($code -ne 0 -or $version -notmatch ("^dial " + [regex]::Escape($expected) + "( |$)")) { throw "Packaged version check failed (exit $code): $version" }
              & ./dial.exe --help
              if ($LASTEXITCODE -ne 0) { throw 'Packaged help check failed' }
            } finally { Pop-Location }
          } finally { Remove-Item -LiteralPath $smoke -Recurse -Force }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify packaged binary format
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/check-artifact.py --dial "dist/dial-$env:RELEASE_TAG-$env:RELEASE_TARGET/dial.exe" --target "$env:RELEASE_TARGET" --format-only
      - name: Test installer under Windows PowerShell 5.1
        shell: powershell
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: ./scripts/test-install.ps1 -ArchivePath "$env:GITHUB_WORKSPACE/dist/dial-$env:RELEASE_TAG-$env:RELEASE_TARGET.zip"
      - name: Test installer under PowerShell 7
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: ./scripts/test-install.ps1 -ArchivePath "$env:GITHUB_WORKSPACE/dist/dial-$env:RELEASE_TAG-$env:RELEASE_TARGET.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
