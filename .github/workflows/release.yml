name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The build jobs read CI's result for the tagged commit instead of re-running its tests.
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap musl-tools
      - name: Install OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Install installer test dependencies
        run: python3 -m pip install --disable-pip-version-check cryptography
      - name: Select musl C compiler
        if: contains(matrix.target, '-musl')
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: echo "CC_${RELEASE_TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo metadata --no-deps --format-version 1 --locked > release-metadata.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads(Path('release-metadata.json').read_text())
          version = next(p['version'] for p in metadata['packages'] if p['name'] == 'dial')
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} must match Cargo.toml version v{version}')
          PY
      - name: Test terminal installer
        run: bash scripts/test-install.sh
      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
        run: cargo build --release --locked -p dial --target "${{ matrix.target }}"
      - name: Package and smoke-test outside the checkout
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="dial-${GITHUB_REF_NAME}-${RELEASE_TARGET}"
          mkdir -p "dist/$package"
          install -m 755 "target/$RELEASE_TARGET/release/dial" "dist/$package/dial"
          cp LICENSE README.md THIRD_PARTY_NOTICES crates/dial-agent/src/agent/compact/snapcompact/fonts/Silver.LICENSE crates/dial-agent/src/agent/compact/snapcompact/fonts/Unscii.LICENSE "dist/$package/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          smoke="$(mktemp -d "${RUNNER_TEMP:-$PWD/dist}/dial-smoke.XXXXXX")"
          trap 'rm -rf "$smoke"' EXIT
          tar -xzf "dist/$package.tar.gz" -C "$smoke"
          python3 scripts/check-artifact.py --dial "$smoke/$package/dial" --target "$RELEASE_TARGET"
          cd "$smoke/$package"
          ./dial --version | awk 'NR==1 {print $1, $2}' | grep -Fx "dial ${GITHUB_REF_NAME#v}"
          ./dial --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  windows-build:
    name: Build and package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'dial' } | Select-Object -First 1).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG must match Cargo.toml version v$version" }
      - name: Build release binary
        env:
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
        run: cargo build --release --locked -p dial --target "${{ matrix.target }}"
      - name: Package and smoke-test outside the checkout
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $package = "dial-$env:GITHUB_REF_NAME-$env:RELEASE_TARGET"
          $dir = "dist/$package"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/$env:RELEASE_TARGET/release/dial.exe" "$dir/dial.exe"
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES, crates/dial-agent/src/agent/compact/snapcompact/fonts/Silver.LICENSE, crates/dial-agent/src/agent/compact/snapcompact/fonts/Unscii.LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$package.zip"
          $expected = "$env:GITHUB_REF_NAME".Substring(1)
          # Capture all output first: piping into `Select-Object -First 1` stops the native
          # command early and leaves $LASTEXITCODE unset, which failed this check.
          $output = & "dist/$package/dial.exe" --version
          $code = $LASTEXITCODE
          $version = @($output)[0]
          if ($code -ne 0 -or $version -notmatch ("^dial " + [regex]::Escape($expected) + "( |$)")) { throw "Packaged version check failed (exit $code): $version" }
          & "dist/$package/dial.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged help check failed" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify packaged binary format
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/check-artifact.py --dial "dist/dial-$env:GITHUB_REF_NAME-$env:RELEASE_TARGET/dial.exe" --target "$env:RELEASE_TARGET" --format-only
      - name: Test installer under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-install.ps1 -ArchivePath "${{ github.workspace }}/dist/dial-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - name: Test installer under PowerShell 7
        shell: pwsh
        run: ./scripts/test-install.ps1 -ArchivePath "${{ github.workspace }}/dist/dial-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  windows-contract:
    name: Windows Rust contract (gates publication)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-contract
      - name: Run focused Windows contract suite
        run: python scripts/windows-contract.py --profile ci

  publish:
    name: Publish GitHub release
    needs: [build, windows-build, windows-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      # Reads CI's result for the tagged commit.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist
      - name: Require passing CI for this commit
        # CI runs the full suite on these same platforms for every push to main; re-running it
        # here doubled release time (10-21 min per macOS job). Builds run while CI is still going;
        # nothing is published until CI has passed for the tagged commit.
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          waited=0
          while :; do
            runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion)
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed for $GITHUB_SHA"
              break
            fi
            pending=$(jq 'any(.[]; .status != "completed")' <<<"$runs")
            # A tag pushed with its commit can start before CI has registered a run.
            if [ "$pending" != true ] && { [ "$runs" != '[]' ] || [ "$waited" -ge 300 ]; }; then
              echo "No successful CI run for $GITHUB_SHA: $runs. Push the commit to main and let CI pass before tagging." >&2
              exit 1
            fi
            sleep 30
            waited=$((waited + 30))
          done
      - name: Validate release signing configuration
        env:
          DIAL_RELEASE_SIGNING_KEY: ${{ secrets.DIAL_RELEASE_SIGNING_KEY }}
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$DIAL_RELEASE_SIGNING_KEY" || { echo 'Required secret DIAL_RELEASE_SIGNING_KEY is missing' >&2; exit 1; }
          test -n "$DIAL_RELEASE_PUBLIC_KEY" || { echo 'Required variable DIAL_RELEASE_PUBLIC_KEY (base64 Ed25519 raw public key) is missing' >&2; exit 1; }
          test -n "$DIAL_RELEASE_PUBLIC_KEY_PEM" || { echo 'Required variable DIAL_RELEASE_PUBLIC_KEY_PEM is missing' >&2; exit 1; }
          printf '%s\n' "$DIAL_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
          printf '%s\n' "$DIAL_RELEASE_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/release-public.pem"
          derived="$(openssl pkey -pubout -outform DER -in "$RUNNER_TEMP/release-key.pem" | tail -c 32 | base64 -w0)"
          test "$derived" = "$DIAL_RELEASE_PUBLIC_KEY" || { echo 'Public key does not match signing key' >&2; exit 1; }
          pem_raw="$(openssl pkey -pubin -in "$RUNNER_TEMP/release-public.pem" -outform DER | tail -c 32 | base64 -w0)"
          test "$pem_raw" = "$DIAL_RELEASE_PUBLIC_KEY" || { echo 'Installer public key does not match embedded update key' >&2; exit 1; }
      - name: Sign release manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          DIAL_RELEASE_SIGNING_KEY: ${{ secrets.DIAL_RELEASE_SIGNING_KEY }}
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          printf 'export DIAL_RELEASE_PUBLIC_KEY=%q\n' "$DIAL_RELEASE_PUBLIC_KEY_PEM" > dist/install.sh
          cat scripts/install.sh >> dist/install.sh
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          pem = os.environ['DIAL_RELEASE_PUBLIC_KEY_PEM'].replace('\r\n', '\n').strip('\n')
          if '-----BEGIN PUBLIC KEY-----' not in pem or "'@" in pem:
              raise SystemExit('DIAL_RELEASE_PUBLIC_KEY_PEM is not a PEM public key')
          source = Path('scripts/install.ps1').read_text(encoding='utf-8')
          placeholder = re.compile(r"^    \$DialReleasePublicKeyPem = ''\r?$", re.M)
          if len(placeholder.findall(source)) != 1:
              raise SystemExit('install.ps1 key placeholder must appear exactly once')
          embedded = placeholder.sub(lambda m: "    $DialReleasePublicKeyPem = @'\n" + pem + "\n'@", source, count=1)
          Path('dist/install.ps1').write_text(embedded, encoding='utf-8', newline='\n')
          PY
          (cd dist && sha256sum -- *.tar.gz *.zip install.sh install.ps1 > SHA256SUMS)
          printf '%s\n' "$DIAL_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-key.pem" -rawin \
            -in dist/SHA256SUMS -out "$RUNNER_TEMP/SHA256SUMS.sig"
          base64 -w0 "$RUNNER_TEMP/SHA256SUMS.sig" > dist/SHA256SUMS.sig
          python3 scripts/make-sshsig.py --openssl openssl --key "$RUNNER_TEMP/release-key.pem" \
            --input dist/SHA256SUMS --output dist/SHA256SUMS.sshsig
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.sshsig dist/install.sh dist/install.ps1 \
            --verify-tag --generate-notes --title "Dial $RELEASE_TAG"
      - name: Open Homebrew formula update PR
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          branch="release-packaging/$RELEASE_TAG"
          git fetch origin main
          git checkout -B "$branch" origin/main
          python3 scripts/update-formula.py --version "$version" --sums dist/SHA256SUMS --formula Formula/dial.rb
          python3 scripts/check-packaging.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/dial.rb
          if git diff --cached --quiet; then
            echo "Formula already matches $RELEASE_TAG; no pull request needed"
            exit 0
          fi
          git commit -m "release: update package metadata for $version"
          git push --force origin "HEAD:refs/heads/$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Pull request for $branch already exists"
          else
            gh pr create --base main --head "$branch" \
              --title "release: Dial $RELEASE_TAG package metadata" \
              --body "Automated Homebrew formula update for $RELEASE_TAG. Merge once the release is published."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve container tags
        id: docker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Publish container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: |
            DIAL_BUILD_REVISION=${{ github.sha }}
            DIAL_RELEASE_PUBLIC_KEY=${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
