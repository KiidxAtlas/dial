name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The build jobs read CI's result for the tagged commit instead of re-running its tests.
  actions: read

concurrency:
  # Serialize tags so an older release cannot race a newer release's latest pointer.
  group: release-publish
  # Retain up to 100 waiting releases instead of replacing the one pending run.
  queue: max
  cancel-in-progress: false

jobs:
  gate:
    name: Require tested main commit
    runs-on: ubuntu-22.04
    outputs:
      epoch: ${{ steps.identity.outputs.epoch }}
      candidates: ${{ steps.candidates.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install check dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.lock
      - name: Validate metadata, notes and public keys before builds
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          make release-check RELEASE_TAG="$RELEASE_TAG"
          python3 scripts/release-policy.py keys
      - name: Require main ancestry
        id: identity
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Require successful push CI on main
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          waited=0
          while :; do
            gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --branch main --json status,conclusion,event,headBranch,headSha,databaseId > "$RUNNER_TEMP/ci-runs.json"
            runs="$(cat "$RUNNER_TEMP/ci-runs.json")"
            if python3 scripts/release-policy.py ci "$GITHUB_SHA" "$RUNNER_TEMP/ci-runs.json"; then
              echo "run=$(python3 scripts/release-policy.py ci-run "$GITHUB_SHA" "$RUNNER_TEMP/ci-runs.json")" >> "$GITHUB_OUTPUT"
              break
            fi
            if ! jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null && { [ "$runs" != '[]' ] || [ "$waited" -ge 300 ]; }; then
              echo "No successful main push CI for $GITHUB_SHA. Push to main and let CI pass before tagging." >&2
              # List every failing job of the latest run so all blockers are visible at once.
              latest="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
              if [ -n "$latest" ]; then
                gh run view "$latest" -R "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "::error title=CI job \(.conclusion)::\(.name) \(.url)"' || true
              fi
              exit 1
            fi
            sleep 30
            waited=$((waited + 30))
          done
      - name: Select complete unsigned candidates from exact-commit CI
        id: candidates
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ steps.ci.outputs.run }}
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          if python3 scripts/release-policy.py artifacts "$GITHUB_SHA" "$RUNNER_TEMP/artifacts.json"; then
            gh run download "$CI_RUN" -R "$GITHUB_REPOSITORY" -n release-assets-identity -D "$RUNNER_TEMP/candidate-identity"
            if python3 scripts/release-policy.py identity "$GITHUB_SHA" "$RUNNER_TEMP/candidate-identity/candidate.json"; then
              echo "run=$CI_RUN" >> "$GITHUB_OUTPUT"
              echo "Reusing all eight tested platform archives from CI run $CI_RUN." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "Candidates unavailable, expired or built with another public key; rebuilding all platforms." >> "$GITHUB_STEP_SUMMARY"

  signing-ready:
    name: Validate protected signing inputs before builds
    needs: gate
    runs-on: ubuntu-22.04
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.lock
      - name: Check signing key presence, type and public-key agreement
        env:
          DIAL_RELEASE_SIGNING_KEY: ${{ secrets.DIAL_RELEASE_SIGNING_KEY }}
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: python3 scripts/release-policy.py keys --private

  build:
    name: Build missing release candidates
    needs: [gate, signing-ready]
    if: needs.gate.outputs.candidates == ''
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ github.ref_name }}
      epoch: ${{ needs.gate.outputs.epoch }}

  sign:
    name: Sign release manifest
    needs: [gate, signing-ready, build]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.signing-ready.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-22.04
    # Configure required reviewers and tag deployment rules in repository settings.
    environment: release-signing
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.gate.outputs.candidates == ''
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.gate.outputs.candidates != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.gate.outputs.candidates }}
          pattern: release-assets-*
          merge-multiple: true
          path: dist
      - name: Recheck candidate commit, version and embedded public key
        env:
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release-policy.py identity "$GITHUB_SHA" dist/candidate.json
          rm dist/candidate.json
      - name: Prepare installers and manifest (no private key)
        env:
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          printf 'export DIAL_RELEASE_PUBLIC_KEY=%q\n' "$DIAL_RELEASE_PUBLIC_KEY_PEM" > dist/install.sh
          cat scripts/install.sh >> dist/install.sh
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          pem = os.environ['DIAL_RELEASE_PUBLIC_KEY_PEM'].replace('\r\n', '\n').strip('\n')
          if '-----BEGIN PUBLIC KEY-----' not in pem or "'@" in pem:
              raise SystemExit('DIAL_RELEASE_PUBLIC_KEY_PEM is not a PEM public key')
          source = Path('scripts/install.ps1').read_text(encoding='utf-8')
          placeholder = re.compile(r"^    \$DialReleasePublicKeyPem = ''\r?$", re.M)
          if len(placeholder.findall(source)) != 1:
              raise SystemExit('install.ps1 key placeholder must appear exactly once')
          embedded = placeholder.sub(lambda m: "    $DialReleasePublicKeyPem = @'\n" + pem + "\n'@", source, count=1)
          Path('dist/install.ps1').write_text(embedded, encoding='utf-8', newline='\n')
          PY
          (cd dist && sha256sum -- *.tar.gz *.zip install.sh install.ps1 > SHA256SUMS)
      - name: Validate keys and sign manifest
        env:
          DIAL_RELEASE_SIGNING_KEY: ${{ secrets.DIAL_RELEASE_SIGNING_KEY }}
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          key="$(mktemp "$RUNNER_TEMP/release-key.XXXXXX")"
          public="$(mktemp "$RUNNER_TEMP/release-public.XXXXXX")"
          trap 'shred -u "$key"; rm -f "$public"' EXIT
          test -n "$DIAL_RELEASE_SIGNING_KEY" && test -n "$DIAL_RELEASE_PUBLIC_KEY" && test -n "$DIAL_RELEASE_PUBLIC_KEY_PEM"
          printf '%s\n' "$DIAL_RELEASE_SIGNING_KEY" > "$key"
          unset DIAL_RELEASE_SIGNING_KEY
          printf '%s\n' "$DIAL_RELEASE_PUBLIC_KEY_PEM" > "$public"
          derived="$(openssl pkey -pubout -outform DER -in "$key" | tail -c 32 | base64 -w0)"
          pem_raw="$(openssl pkey -pubin -in "$public" -outform DER | tail -c 32 | base64 -w0)"
          test "$derived" = "$DIAL_RELEASE_PUBLIC_KEY" && test "$pem_raw" = "$DIAL_RELEASE_PUBLIC_KEY"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/SHA256SUMS -out "$RUNNER_TEMP/SHA256SUMS.sig"
          base64 -w0 "$RUNNER_TEMP/SHA256SUMS.sig" > dist/SHA256SUMS.sig
          python3 scripts/make-sshsig.py --openssl openssl --key "$key" --input dist/SHA256SUMS --output dist/SHA256SUMS.sshsig
      - name: Remove release signing key
        # The trap above covers failures and ordinary cancellation; this step also runs when the
        # signing step was killed before its trap could fire.
        if: always()
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'release-key.*' -exec shred -u -- {} +
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish signed release
    needs: sign
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-assets
          path: dist
      - name: Verify signed manifest
        # Fail closed unless every file handed over by `sign` matches SHA256SUMS and the
        # signature verifies against the public key.
        env:
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --strict --check SHA256SUMS)
          printf '%s\n' "$DIAL_RELEASE_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/release-public.pem"
          base64 -d dist/SHA256SUMS.sig > "$RUNNER_TEMP/SHA256SUMS.sig"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release-public.pem" -rawin \
            -in dist/SHA256SUMS -sigfile "$RUNNER_TEMP/SHA256SUMS.sig"
      - name: Decide whether this is the newest stable release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/release-tags"
          python3 scripts/release-policy.py latest "$RELEASE_TAG" "$RUNNER_TEMP/release-tags" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          set -euo pipefail
          python3 scripts/release-policy.py notes "$RELEASE_TAG" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.sshsig dist/install.sh dist/install.ps1 \
            --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --latest="$IS_LATEST" --title "Dial $RELEASE_TAG"
          {
            echo "## Binary release published"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            echo "Downstream website, package metadata and container jobs can be retried independently; do not rebuild published binaries."
          } >> "$GITHUB_STEP_SUMMARY"

  website:
    name: Show the new release on dial.rootatlas.dev
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Refresh the site's cached release
        # dial-web caches GitHub's latest release for an hour; this replaces it at once.
        # The token matches NUXT_RELEASE_REFRESH_TOKEN on the dial-web Railway service.
        env:
          DIAL_WEB_REFRESH_TOKEN: ${{ secrets.DIAL_WEB_REFRESH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$DIAL_WEB_REFRESH_TOKEN" ]; then
            echo "::error title=Website refresh not configured::Set DIAL_WEB_REFRESH_TOKEN here and the same NUXT_RELEASE_REFRESH_TOKEN on the dial-web service. Binaries are already published."
            exit 1
          fi
          status="$(curl --silent --show-error --retry 3 --retry-connrefused --max-time 30 \
            --output "$RUNNER_TEMP/release.json" --write-out '%{http_code}' \
            -X POST -H "Authorization: Bearer $DIAL_WEB_REFRESH_TOKEN" \
            https://dial.rootatlas.dev/release/refresh)"
          if [ "$status" != 200 ]; then
            echo "::error title=Website refresh HTTP $status::Binaries are already published. For 404, configure NUXT_RELEASE_REFRESH_TOKEN on dial-web and deploy the refresh route; for 401, match it to DIAL_WEB_REFRESH_TOKEN. Rerun this failed job only."
            exit 1
          fi
          version="$(jq -r .version "$RUNNER_TEMP/release.json")"
          if [ "$version" != "$RELEASE_TAG" ]; then
            echo "::error title=Website stale::Website did not return the published release. Rerun this job only."
            exit 1
          fi
          echo "Website now shows $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  packaging:
    name: Propose package metadata update
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-assets
          path: dist
      - name: Verify signed manifest
        # The formula and AUR checksums are merged without review, so re-check the signature here.
        env:
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DIAL_RELEASE_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/release-public.pem"
          base64 -d dist/SHA256SUMS.sig > "$RUNNER_TEMP/SHA256SUMS.sig"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release-public.pem" -rawin \
            -in dist/SHA256SUMS -sigfile "$RUNNER_TEMP/SHA256SUMS.sig"
      - name: Update and merge Homebrew formula and AUR metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          branch="release-packaging/$RELEASE_TAG"
          git fetch origin main
          git checkout -B "$branch" origin/main
          python3 scripts/update-formula.py --version "$version" --sums dist/SHA256SUMS \
            --formula Formula/dial.rb --aur packaging/aur/dial-bin
          python3 scripts/check-packaging.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/dial.rb packaging/aur/dial-bin
          if git diff --cached --quiet; then
            echo "Package metadata already matches $RELEASE_TAG; no pull request needed"
            exit 0
          fi
          git commit -m "release: update package metadata for $version"
          git push --force origin "HEAD:refs/heads/$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Pull request for $branch already exists"
          else
            gh pr create --base main --head "$branch" \
              --title "release: Dial $RELEASE_TAG package metadata" \
              --body "Automated Homebrew formula and AUR metadata update for $RELEASE_TAG, generated from the signed SHA256SUMS of the published release."
          fi
          # The release is already published (this job needs publish) and the checksums come from
          # its verified manifest, so merge now; an unmerged PR leaves Homebrew users on the old version.
          # Publishing to the AUR itself still needs the maintainer's AUR key (packaging/README.md).
          gh pr merge "$branch" --merge --delete-branch

  container:
    name: Publish signed container with build provenance and SBOM
    needs: [publish, gate]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-assets
          path: dist
      - name: Verify and stage the published Linux binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: python3 scripts/stage-container.py dist container-context
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve container tags
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ needs.publish.outputs.latest == 'true' }}
      - name: Publish container
        id: container-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: container-context
          file: Dockerfile.release
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,scope=docker-release,mode=max
      - name: Smoke-test published container
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.container-build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="${IMAGE_REPOSITORY,,}@$IMAGE_DIGEST"
          docker run --rm "$image" --version | awk 'NR==1 {print $1, $2}' | grep -Fx "dial ${RELEASE_TAG#v}"
          docker run --rm "$image" --help >/dev/null
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.2; verifies pinned bootstrap checksum
        with:
          cosign-release: v3.0.6
      - name: Sign immutable container digest with GitHub OIDC
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.container-build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${IMAGE_REPOSITORY,,}@$IMAGE_DIGEST"
          cosign sign --yes "$image"
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            "$image"
