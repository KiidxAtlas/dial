name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The build jobs read CI's result for the tagged commit instead of re-running its tests.
  actions: read

concurrency:
  # Serialize tags so an older release cannot race a newer release's latest pointer.
  group: release-publish
  # Retain up to 100 waiting releases instead of replacing the one pending run.
  queue: max
  cancel-in-progress: false

jobs:
  gate:
    name: Require tested main commit
    runs-on: ubuntu-22.04
    outputs:
      epoch: ${{ steps.identity.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require main ancestry
        id: identity
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Require successful push CI on main
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          waited=0
          while :; do
            gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --branch main --json status,conclusion,event,headBranch,headSha > "$RUNNER_TEMP/ci-runs.json"
            runs="$(cat "$RUNNER_TEMP/ci-runs.json")"
            if python3 scripts/release-policy.py ci "$GITHUB_SHA" "$RUNNER_TEMP/ci-runs.json"; then
              break
            fi
            if ! jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null && { [ "$runs" != '[]' ] || [ "$waited" -ge 300 ]; }; then
              echo "No successful main push CI for $GITHUB_SHA. Push to main and let CI pass before tagging." >&2
              # List every failing job of the latest run so all blockers are visible at once.
              latest="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
              if [ -n "$latest" ]; then
                gh run view "$latest" -R "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "::error title=CI job \(.conclusion)::\(.name) \(.url)"' || true
              fi
              exit 1
            fi
            sleep 30
            waited=$((waited + 30))
          done

  build:
    name: Package ${{ matrix.target }}
    needs: gate
    env:
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap musl-tools
      - name: Install OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Install installer test dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-ci.txt
      - name: Select musl C compiler
        if: contains(matrix.target, '-musl')
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: echo "CC_${RELEASE_TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo metadata --no-deps --format-version 1 --locked > release-metadata.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads(Path('release-metadata.json').read_text())
          version = next(p['version'] for p in metadata['packages'] if p['name'] == 'dial')
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} must match Cargo.toml version v{version}')
          PY
      - name: Test terminal installer
        run: bash scripts/test-install.sh
      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
        run: cargo build --release --locked -p dial --target "${{ matrix.target }}"
      - name: Package and smoke-test outside the checkout
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="dial-${GITHUB_REF_NAME}-${RELEASE_TARGET}"
          mkdir -p "dist/$package"
          install -m 755 "target/$RELEASE_TARGET/release/dial" "dist/$package/dial"
          cp LICENSE README.md THIRD_PARTY_NOTICES crates/dial-agent/src/agent/compact/snapcompact/fonts/Silver.LICENSE crates/dial-agent/src/agent/compact/snapcompact/fonts/Unscii.LICENSE "dist/$package/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          smoke="$(mktemp -d "${RUNNER_TEMP:-$PWD/dist}/dial-smoke.XXXXXX")"
          trap 'rm -rf "$smoke"' EXIT
          tar -xzf "dist/$package.tar.gz" -C "$smoke"
          python3 scripts/check-artifact.py --dial "$smoke/$package/dial" --target "$RELEASE_TARGET"
          cd "$smoke/$package"
          ./dial --version | awk 'NR==1 {print $1, $2}' | grep -Fx "dial ${GITHUB_REF_NAME#v}"
          ./dial --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  windows-build:
    name: Build and package ${{ matrix.target }}
    needs: gate
    env:
      SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'dial' } | Select-Object -First 1).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG must match Cargo.toml version v$version" }
      - name: Build release binary
        env:
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
        run: cargo build --release --locked -p dial --target "${{ matrix.target }}"
      - name: Package and smoke-test outside the checkout
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $package = "dial-$env:GITHUB_REF_NAME-$env:RELEASE_TARGET"
          $dir = "dist/$package"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/$env:RELEASE_TARGET/release/dial.exe" "$dir/dial.exe"
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES, crates/dial-agent/src/agent/compact/snapcompact/fonts/Silver.LICENSE, crates/dial-agent/src/agent/compact/snapcompact/fonts/Unscii.LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$package.zip"
          $expected = "$env:GITHUB_REF_NAME".Substring(1)
          # Capture all output first: piping into `Select-Object -First 1` stops the native
          # command early and leaves $LASTEXITCODE unset, which failed this check.
          $output = & "dist/$package/dial.exe" --version
          $code = $LASTEXITCODE
          $version = @($output)[0]
          if ($code -ne 0 -or $version -notmatch ("^dial " + [regex]::Escape($expected) + "( |$)")) { throw "Packaged version check failed (exit $code): $version" }
          & "dist/$package/dial.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged help check failed" }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify packaged binary format
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/check-artifact.py --dial "dist/dial-$env:GITHUB_REF_NAME-$env:RELEASE_TARGET/dial.exe" --target "$env:RELEASE_TARGET" --format-only
      - name: Test installer under Windows PowerShell 5.1
        shell: powershell
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: ./scripts/test-install.ps1 -ArchivePath "$env:GITHUB_WORKSPACE/dist/dial-$env:GITHUB_REF_NAME-$env:RELEASE_TARGET.zip"
      - name: Test installer under PowerShell 7
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: ./scripts/test-install.ps1 -ArchivePath "$env:GITHUB_WORKSPACE/dist/dial-$env:GITHUB_REF_NAME-$env:RELEASE_TARGET.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  sign:
    name: Sign release manifest
    needs: [build, windows-build]
    runs-on: ubuntu-22.04
    # Configure required reviewers and tag deployment rules in repository settings.
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist
      - name: Prepare installers and manifest (no private key)
        env:
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          printf 'export DIAL_RELEASE_PUBLIC_KEY=%q\n' "$DIAL_RELEASE_PUBLIC_KEY_PEM" > dist/install.sh
          cat scripts/install.sh >> dist/install.sh
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          pem = os.environ['DIAL_RELEASE_PUBLIC_KEY_PEM'].replace('\r\n', '\n').strip('\n')
          if '-----BEGIN PUBLIC KEY-----' not in pem or "'@" in pem:
              raise SystemExit('DIAL_RELEASE_PUBLIC_KEY_PEM is not a PEM public key')
          source = Path('scripts/install.ps1').read_text(encoding='utf-8')
          placeholder = re.compile(r"^    \$DialReleasePublicKeyPem = ''\r?$", re.M)
          if len(placeholder.findall(source)) != 1:
              raise SystemExit('install.ps1 key placeholder must appear exactly once')
          embedded = placeholder.sub(lambda m: "    $DialReleasePublicKeyPem = @'\n" + pem + "\n'@", source, count=1)
          Path('dist/install.ps1').write_text(embedded, encoding='utf-8', newline='\n')
          PY
          (cd dist && sha256sum -- *.tar.gz *.zip install.sh install.ps1 > SHA256SUMS)
      - name: Validate keys and sign manifest
        env:
          DIAL_RELEASE_SIGNING_KEY: ${{ secrets.DIAL_RELEASE_SIGNING_KEY }}
          DIAL_RELEASE_PUBLIC_KEY: ${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          key="$(mktemp "$RUNNER_TEMP/release-key.XXXXXX")"
          public="$(mktemp "$RUNNER_TEMP/release-public.XXXXXX")"
          trap 'shred -u "$key"; rm -f "$public"' EXIT
          test -n "$DIAL_RELEASE_SIGNING_KEY" && test -n "$DIAL_RELEASE_PUBLIC_KEY" && test -n "$DIAL_RELEASE_PUBLIC_KEY_PEM"
          printf '%s\n' "$DIAL_RELEASE_SIGNING_KEY" > "$key"
          unset DIAL_RELEASE_SIGNING_KEY
          printf '%s\n' "$DIAL_RELEASE_PUBLIC_KEY_PEM" > "$public"
          derived="$(openssl pkey -pubout -outform DER -in "$key" | tail -c 32 | base64 -w0)"
          pem_raw="$(openssl pkey -pubin -in "$public" -outform DER | tail -c 32 | base64 -w0)"
          test "$derived" = "$DIAL_RELEASE_PUBLIC_KEY" && test "$pem_raw" = "$DIAL_RELEASE_PUBLIC_KEY"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/SHA256SUMS -out "$RUNNER_TEMP/SHA256SUMS.sig"
          base64 -w0 "$RUNNER_TEMP/SHA256SUMS.sig" > dist/SHA256SUMS.sig
          python3 scripts/make-sshsig.py --openssl openssl --key "$key" --input dist/SHA256SUMS --output dist/SHA256SUMS.sshsig
      - name: Remove release signing key
        # The trap above covers failures and ordinary cancellation; this step also runs when the
        # signing step was killed before its trap could fire.
        if: always()
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'release-key.*' -exec shred -u -- {} +
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish signed release
    needs: sign
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-assets
          path: dist
      - name: Verify signed manifest
        # Fail closed unless every file handed over by `sign` matches SHA256SUMS and the
        # signature verifies against the public key.
        env:
          DIAL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DIAL_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --strict --check SHA256SUMS)
          printf '%s\n' "$DIAL_RELEASE_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/release-public.pem"
          base64 -d dist/SHA256SUMS.sig > "$RUNNER_TEMP/SHA256SUMS.sig"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release-public.pem" -rawin \
            -in dist/SHA256SUMS -sigfile "$RUNNER_TEMP/SHA256SUMS.sig"
      - name: Decide whether this is the newest stable release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/release-tags"
          python3 scripts/release-policy.py latest "$RELEASE_TAG" "$RUNNER_TEMP/release-tags" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          set -euo pipefail
          python3 scripts/release-policy.py notes "$RELEASE_TAG" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.sshsig dist/install.sh dist/install.ps1 \
            --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --latest="$IS_LATEST" --title "Dial $RELEASE_TAG"

  packaging:
    name: Propose package metadata update
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-assets
          path: dist
      - name: Open Homebrew formula update PR
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          branch="release-packaging/$RELEASE_TAG"
          git fetch origin main
          git checkout -B "$branch" origin/main
          python3 scripts/update-formula.py --version "$version" --sums dist/SHA256SUMS --formula Formula/dial.rb
          python3 scripts/check-packaging.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/dial.rb
          if git diff --cached --quiet; then
            echo "Formula already matches $RELEASE_TAG; no pull request needed"
            exit 0
          fi
          git commit -m "release: update package metadata for $version"
          git push --force origin "HEAD:refs/heads/$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Pull request for $branch already exists"
          else
            gh pr create --base main --head "$branch" \
              --title "release: Dial $RELEASE_TAG package metadata" \
              --body "Automated Homebrew formula update for $RELEASE_TAG. Merge once the release is published."
          fi

  container:
    name: Publish signed container with build provenance and SBOM
    needs: [publish, gate]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve container tags
        id: docker-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ needs.publish.outputs.latest == 'true' }}
      - name: Publish container
        id: container-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            DIAL_BUILD_REVISION=${{ github.sha }}
            DIAL_RELEASE_PUBLIC_KEY=${{ vars.DIAL_RELEASE_PUBLIC_KEY }}
            SOURCE_DATE_EPOCH=${{ needs.gate.outputs.epoch }}
          provenance: mode=max
          sbom: true
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2; verifies pinned bootstrap checksum
        with:
          cosign-release: v3.0.6
      - name: Sign immutable container digest with GitHub OIDC
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.container-build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${IMAGE_REPOSITORY,,}@$IMAGE_DIGEST"
          cosign sign --yes "$image"
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            "$image"
