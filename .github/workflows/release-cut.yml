name: Cut release

# Release main's current version: wait for main CI on the head commit to pass (it builds the
# release candidates), tag that commit and start the release workflow on the tag. The candidates
# are already built, so the release itself publishes in a few minutes. Start it from the Actions
# tab or with `gh workflow run release-cut.yml`; scripts/release.sh --tag --push does the same
# from a local main checkout.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Tag main and start the release
    runs-on: ubuntu-22.04
    permissions:
      # Push the release tag.
      contents: write
      # Read main CI and dispatch the release workflow on the tag.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install check dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.lock
      - name: Select the version and check its notes
        id: version
        run: |
          set -euo pipefail
          tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged; main has not moved to the next version yet." >&2
            exit 1
          fi
          make release-check RELEASE_TAG="$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for successful main CI on this commit
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          waited=0
          while :; do
            gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --branch main \
              --json status,conclusion,event,headBranch,headSha,databaseId > "$RUNNER_TEMP/ci-runs.json"
            if python3 scripts/release-policy.py ci "$SHA" "$RUNNER_TEMP/ci-runs.json"; then
              break
            fi
            if ! jq -e 'any(.[]; .status != "completed")' "$RUNNER_TEMP/ci-runs.json" >/dev/null; then
              if [ "$(cat "$RUNNER_TEMP/ci-runs.json")" = '[]' ] && [ "$waited" -eq 0 ]; then
                # A merge made with GITHUB_TOKEN starts no push run; test this commit now.
                gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref main
              elif [ "$(cat "$RUNNER_TEMP/ci-runs.json")" != '[]' ] || [ "$waited" -ge 300 ]; then
                echo "No successful main CI for $SHA; fix main and run this workflow again." >&2
                exit 1
              fi
            fi
            sleep 30
            waited=$((waited + 30))
          done
      - name: Tag and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" -m "Dial $TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          # A tag pushed with GITHUB_TOKEN starts no push run, so start the release explicitly.
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Tagged $TAG at $SHA and started the release workflow." >> "$GITHUB_STEP_SUMMARY"
