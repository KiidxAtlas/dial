name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: fmt, build, test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable --no-self-update
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked
