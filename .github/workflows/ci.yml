name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Release packaging dispatches CI for its metadata pull request: a pull request pushed with
  # GITHUB_TOKEN starts no pull_request run, and main requires these checks before merging.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes its running checks. Pushes to main each finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: No-build readiness
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Find an already-tested pull request whose candidates main can reuse.
      actions: read
      pull-requests: read
    outputs:
      candidate-tag: ${{ steps.candidate.outputs.tag }}
      epoch: ${{ steps.candidate.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release-candidate reuse checks that a merged pull request head is in main's history.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install check dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.lock
      - name: No-build release and workflow contracts
        run: make release-check test-release-policy
      - name: Tool audit ownership, coverage ratchet and closure contracts
        env:
          AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          make test-tool-audit
          if [ -n "$AUDIT_BASE" ] && [ "$AUDIT_BASE" != 0000000000000000000000000000000000000000 ]; then
            # A force-push can leave `before` outside history; ratchet against the first parent
            # instead of failing or silently skipping the comparison.
            if ! git cat-file -e "$AUDIT_BASE^{commit}" 2>/dev/null; then
              echo "::notice::audit base $AUDIT_BASE is unavailable; comparing against HEAD^"
              AUDIT_BASE=$(git rev-parse HEAD^)
            fi
            python3 examples/benchmarks/tool_audit.py validate --base-ref "$AUDIT_BASE"
          fi
      - name: Format before any compilation
        run: cargo fmt --check
      - name: Unused Rust dependencies (cargo-machete 0.9.2)
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          tool_dir="$(mktemp -d)"
          trap 'rm -f "$archive"; rm -rf "$tool_dir"' EXIT
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/cargo-machete-v0.9.2-x86_64-unknown-linux-musl.tar.gz -o "$archive"
          echo "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$tool_dir" --strip-components=1 cargo-machete-v0.9.2-x86_64-unknown-linux-musl/cargo-machete
          PATH="$tool_dir:$PATH" make lint-deps
      - name: Select untagged release candidate
        id: candidate
        # Version-bump pull requests from this repository build candidates too, so a release
        # tagged right after the merge reuses them instead of waiting for main to rebuild.
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import tomllib; print("v" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Build from the same event commit CI tests. Admit PR candidates only if the
            # tested merge tree is also the PR head tree, so the release can reuse them.
            if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse "$HEAD_SHA^{tree}")" ]; then
              echo "Pull request is behind main; no release candidates for this run." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          elif RELEASE_TAG="$tag" scripts/release-candidate-run.sh "$GITHUB_SHA" > "$RUNNER_TEMP/reused"; then
            echo "Reusing candidates from pull request CI run $(cat "$RUNNER_TEMP/reused")." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "tag=$tag"
            echo "epoch=$(git show -s --format=%ct "$HEAD_SHA")"
          } >> "$GITHUB_OUTPUT"

  release-candidates:
    name: Unsigned release candidates
    needs: validate
    if: needs.validate.outputs.candidate-tag != ''
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.validate.outputs.candidate-tag }}
      epoch: ${{ needs.validate.outputs.epoch }}

  test:
    # macOS: driver/installer/release-tooling checks plus the focused macOS contract. The portable
    # Rust suite runs once, on Linux (linux-tests below).
    name: fmt, build, test (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ github.event_name == 'push' && vars.DIAL_MACOS_RUNNER || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install terminal fixture and OpenSSL 3 on macOS
        run: |
          command -v tmux || brew install tmux
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test embedded driver contracts
        run: make test-drivers
      - name: Install Rust
        # Honor rust-toolchain.toml instead of downloading an unrelated moving stable toolchain.
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test-${{ matrix.os }}
          # A failing test still leaves a valid build; without this a red run discards the
          # compilation and the next run on that OS starts cold.
          cache-on-failure: true
          # The repository's 10 GB cache quota evicts least-recently-used entries; pull requests
          # restore main's caches but do not add their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install installer test dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.lock
      - name: Test terminal installer
        run: make test-install
      - name: Test local build and update commands
        run: make test-build
      - name: Test focused Windows contract runner
        run: make test-windows-contract
      - name: Test embedded host preparation
        # The embedded shell host is built and smoke-checked by scripts/embedded-host.py; this checks its
        # command and environment contract with mocked Cargo. The live path runs in the Rust test steps.
        run: make test-embedded-host
      - name: Check packaging and release policy
        run: make test-packaging test-release-policy
      - name: Run focused macOS contract suite
        # Modules with macOS-specific code: scripts/macos-contract.txt. Portable tests run in full
        # on Linux; repeating them here took ~11 minutes of the macOS critical path. The contract
        # builds only the test targets it selects.
        run: python3 scripts/windows-contract.py --contract scripts/macos-contract.txt --label macOS --profile ci

  linux-tests:
    # The portable Rust suite, split across two runners by nextest's stable hash partition. The
    # required `fmt, build, test (ubuntu-22.04)` check is linux-gate below, which passes only when
    # both partitions and linux-runtime pass.
    name: Linux tests (${{ matrix.partition }}/2)
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test-ubuntu-22.04
          cache-on-failure: true
          # Both partitions and linux-runtime restore this cache; one writer keeps a single entry.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.partition == 1 }}
      # Python, driver, installer and release-tooling checks run once, in partition 1; partition 2
      # takes the doctests instead.
      - name: Test embedded driver contracts
        if: matrix.partition == 1
        run: make test-drivers
      - name: Install installer test dependencies
        if: matrix.partition == 1
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.lock
      - name: Test terminal installer
        if: matrix.partition == 1
        run: make test-install
      - name: Test local build and update commands
        if: matrix.partition == 1
        run: make test-build
      - name: Test focused Windows contract runner
        if: matrix.partition == 1
        run: make test-windows-contract
      - name: Check packaging and release policy
        if: matrix.partition == 1
        run: make test-packaging test-release-policy
      - name: Verify Linux sandbox enforcement
        if: matrix.partition == 1
        timeout-minutes: 10
        run: cargo test --locked --profile ci --workspace linux_sandbox_enforces_filesystem_and_both_network_modes
      - name: Build
        # The `dial` library and its unit-test build each peak near 5 GB in rustc and are still
        # built one at a time, and workspace crates one lib target at a time. The `ci` profile
        # drops debug info, which cuts rustc memory, link time and cache size.
        run: |
          cargo build --locked --profile ci --workspace --lib
          cargo test --locked --profile ci --workspace --lib --no-run
          cargo build --locked --profile ci --workspace --all-targets
      - name: Install cargo-nextest (verified archive)
        # SHA-256 pin is from the upstream 0.9.150 release checksum asset.
        env:
          NEXTEST_VERSION: 0.9.150
        run: |
          set -euo pipefail
          platform=x86_64-unknown-linux-gnu
          checksum=b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f
          archive="$RUNNER_TEMP/nextest.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-$platform.tar.gz" -o "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 -c -
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          tar -xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-nextest
          cargo nextest --version
      - name: Test
        # cargo-nextest runs every test binary at once, one process per test (.config/nextest.toml
        # fails a test still running after 5 minutes). Each partition runs half the tests by a
        # stable hash of their names; doctests run in partition 2.
        run: >-
          make test-nextest TEST_PROFILE=ci NEXTEST_PROFILE=ci
          NEXTEST_PARTITION=hash:${{ matrix.partition }}/2
          NEXTEST_DOCTESTS=${{ matrix.partition == 2 && '1' || '0' }}
      - name: Preserve per-test timing and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-ubuntu-22.04-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  linux-runtime:
    # The installed binary, real terminals and runtime overhead. They are not architecture-sensitive,
    # so only Ubuntu runs them, beside the test partitions rather than after them. `make preflight`
    # runs the same smoke and real-terminal suites on a developer's macOS host.
    name: Linux runtime checks
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test-ubuntu-22.04
          save-if: false
      - name: Install installer test dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.lock
      - name: Build
        run: cargo build --locked --profile ci -p dial --bin dial
      - name: Check slim build
        run: cargo check --locked --profile ci --no-default-features -p dial --bin dial
      - name: Install executable and verify artifact contracts
        timeout-minutes: 10
        run: |
          mkdir -p target/installed/bin
          install -m755 "${CARGO_TARGET_DIR:-target}/ci/dial" target/installed/bin/dial
          make test-smoke DIAL=target/installed/bin/dial
      - name: Real terminal and crash lifecycle
        timeout-minutes: 10
        run: |
          python3 examples/benchmarks/interactive_smoke.py --dial target/installed/bin/dial --captures target/pty-captures/main
          python3 examples/benchmarks/interactive_surfaces.py --dial target/installed/bin/dial --captures target/pty-captures/surfaces
          python3 examples/benchmarks/session_contention_smoke.py --dial target/installed/bin/dial --captures target/pty-captures/contention
          python3 examples/benchmarks/side_lifecycle_smoke.py --dial target/installed/bin/dial --captures target/pty-captures/side-lifecycle
      - name: Record runtime overhead
        continue-on-error: true
        run: cargo run --locked --profile ci --example runtime_baseline -- target/runtime-baseline.json
      - name: Preserve runtime baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-baseline-ubuntu-22.04
          path: target/runtime-baseline.json
      - name: Preserve terminal failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-ubuntu-22.04
          path: target/pty-captures

  linux-gate:
    # Keeps the required check name: passes only when both test partitions and the runtime checks
    # passed (skipped or cancelled counts as failure).
    name: fmt, build, test (ubuntu-22.04)
    needs: [linux-tests, linux-runtime]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require every Linux test partition and the runtime checks
        env:
          TESTS: ${{ needs.linux-tests.result }}
          RUNTIME: ${{ needs.linux-runtime.result }}
        run: |
          echo "Linux tests: $TESTS; Linux runtime checks: $RUNTIME"
          test "$TESTS" = success && test "$RUNTIME" = success

  lint:
    name: Clippy (${{ matrix.os }}) and dependency policy
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ github.event_name == 'push' && matrix.os == 'macos-15' && vars.DIAL_MACOS_RUNNER || github.event_name == 'push' && matrix.os == 'windows-2025' && vars.DIAL_WINDOWS_RUNNER || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust and Clippy
        run: |
          rustup show active-toolchain
          rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Linux checks and feature coverage use the same dev-profile dependency artifacts.
          # Reuse the existing feature cache instead of storing another ~400 MB copy.
          shared-key: ${{ matrix.os == 'ubuntu-22.04' && 'features-ubuntu-22.04' || '' }}
          key: ${{ matrix.os != 'ubuntu-22.04' && format('lint-{0}', matrix.os) || '' }}
          # The largest feature selection remains the sole writer of the shared Linux cache.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.os != 'ubuntu-22.04' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        if: runner.os == 'Linux'
        with:
          command: check
          command-arguments: advisories licenses bans sources

  musl:
    # Release builds ship musl binaries; check them on every push so target-specific type
    # differences (for example libc's ioctl request type) fail here, not at publish time. A main
    # push that builds release candidates already compiles both musl targets, so it skips this.
    name: musl check (${{ matrix.target }})
    needs: validate
    if: github.event_name != 'push' || needs.validate.outputs.candidate-tag == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl toolchain
        env:
          CHECK_TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup show active-toolchain
          rustup target add "$CHECK_TARGET"
          echo "CC_${CHECK_TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: musl-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check
        run: cargo check --locked --profile ci -p dial --target "${{ matrix.target }}"

  python:
    name: Python tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/requirements-ci.lock
      - run: make test-python PYTHON=python
      - name: Benchmark graders and repeated-trial reporting
        run: make test-bench-offline PYTHON=python
  installer-windows:
    name: Windows installer (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-2025
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test install.ps1
        run: ./scripts/test-install.ps1
  windows-rust:
    name: Windows Rust contract
    needs: validate
    runs-on: ${{ github.event_name == 'push' && vars.DIAL_WINDOWS_RUNNER || 'windows-2025' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test contract runner selection and empty-filter rejection
        run: python scripts/test-windows-contract.py
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-contract
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Focused native suite with a tracked exclusion list: scripts/windows-contract.txt.
      - name: Run focused Windows contract suite
        run: python scripts/windows-contract.py --profile ci

  linux-features:
    name: Linux feature checks
    needs: validate
    uses: ./.github/workflows/linux-features.yml
    with:
      exhaustive: false
