name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes its running checks. Pushes to main each finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: No-build readiness
    runs-on: ubuntu-22.04
    outputs:
      candidate-tag: ${{ steps.candidate.outputs.tag }}
      epoch: ${{ steps.candidate.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install check dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.lock
      - name: No-build release and workflow contracts
        run: make release-check test-release-policy
      - name: Format before any compilation
        run: cargo fmt --check
      - name: Unused Rust dependencies (cargo-machete 0.9.2)
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          tool_dir="$(mktemp -d)"
          trap 'rm -f "$archive"; rm -rf "$tool_dir"' EXIT
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/cargo-machete-v0.9.2-x86_64-unknown-linux-musl.tar.gz -o "$archive"
          echo "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$tool_dir" --strip-components=1 cargo-machete-v0.9.2-x86_64-unknown-linux-musl/cargo-machete
          PATH="$tool_dir:$PATH" make lint-deps
      - name: Select untagged main release candidate
        id: candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import tomllib; print("v" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          fi

  release-candidates:
    name: Unsigned release candidates
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.candidate-tag != ''
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.validate.outputs.candidate-tag }}
      epoch: ${{ needs.validate.outputs.epoch }}

  test:
    name: fmt, build, test (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, "${{ vars.DIAL_MACOS_INTEL_RUNNER || 'macos-15-intel' }}", ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux
      - name: Install terminal fixture and OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        run: |
          command -v tmux || brew install tmux
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          # Retain Intel's source-built cryptography wheel without PR/tag cache copies.
          cache: ${{ github.ref == 'refs/heads/main' && runner.os == 'macOS' && runner.arch == 'X64' && 'pip' || '' }}
          cache-dependency-path: scripts/requirements-ci.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test embedded driver contracts
        run: make test-drivers
      - name: Install Rust
        # Honor rust-toolchain.toml instead of downloading an unrelated moving stable toolchain.
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test-${{ matrix.os }}
          # A failing test or smoke step still leaves a valid build; without this a red run
          # discards ~10 minutes of compilation and the next run on that OS starts cold.
          cache-on-failure: true
          # The repository's 10 GB cache quota evicts least-recently-used entries; pull requests
          # restore main's caches but do not add their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install installer test dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.lock
      - name: Test terminal installer
        run: make test-install
      - name: Test local build and update commands
        run: make test-build
      - name: Test focused Windows contract runner
        run: make test-windows-contract
      - name: Check packaging and release policy
        run: make test-packaging test-release-policy
      - name: Verify Linux sandbox enforcement
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: cargo test --locked --profile ci --workspace linux_sandbox_enforces_filesystem_and_both_network_modes
      - name: Build
        # The `dial` library and its unit-test build each peak near 5 GB in rustc. Built together
        # they exceed the 7 GB macOS arm64 runner and swap (11-16 min); one at a time they fit.
        # Workspace crates (crates/dial-*) are built one lib target at a time for the same reason.
        # The `ci` profile drops debug info, which cuts rustc memory, link time and cache size.
        run: |
          cargo build --locked --profile ci --workspace --lib
          cargo test --locked --profile ci --workspace --lib --no-run
          cargo build --locked --profile ci --workspace --all-targets
      - name: Install cargo-nextest (verified archive)
        # SHA-256 pins are from the upstream 0.9.150 release checksum assets.
        env:
          NEXTEST_VERSION: 0.9.150
        run: |
          set -euo pipefail
          platform=x86_64-unknown-linux-gnu
          checksum=b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f
          if [[ "$RUNNER_OS" == macOS ]]; then
            platform=universal-apple-darwin
            checksum=82a759b4d218d38359424196ab244c470e8f7c7d149c814fbbeef4d67c3c301a
          fi
          archive="$RUNNER_TEMP/nextest.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-$platform.tar.gz" -o "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 -c -
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          tar -xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-nextest
          cargo nextest --version
      - name: Test
        # cargo-nextest runs every test binary at once, one process per test (.config/nextest.toml
        # fails a test still running after 5 minutes); `cargo test` ran the binaries one after
        # another. Doctests still run under `cargo test --doc`.
        run: make test-nextest TEST_PROFILE=ci
      # The steps below exercise the installed binary, real terminals and runtime overhead. They
      # are not architecture-sensitive and macos-15 runs them; skipping them on the slower Intel
      # runner keeps it from being the CI long pole. Intel still builds and runs every test above,
      # and the release workflow builds and smoke-tests the packaged x86_64-apple-darwin archive.
      - name: Check slim build
        if: matrix.os != (vars.DIAL_MACOS_INTEL_RUNNER || 'macos-15-intel')
        run: cargo check --locked --profile ci --no-default-features -p dial --bin dial
      - name: Install executable and verify artifact contracts
        if: matrix.os != (vars.DIAL_MACOS_INTEL_RUNNER || 'macos-15-intel')
        timeout-minutes: 10
        run: |
          mkdir -p target/installed/bin
          install -m755 "${CARGO_TARGET_DIR:-target}/ci/dial" target/installed/bin/dial
          make test-smoke DIAL=target/installed/bin/dial
      - name: Real terminal and crash lifecycle
        if: matrix.os != (vars.DIAL_MACOS_INTEL_RUNNER || 'macos-15-intel')
        timeout-minutes: 10
        run: |
          python3 examples/benchmarks/interactive_smoke.py --dial target/installed/bin/dial --captures target/pty-captures/main
          python3 examples/benchmarks/interactive_surfaces.py --dial target/installed/bin/dial --captures target/pty-captures/surfaces
          python3 examples/benchmarks/session_contention_smoke.py --dial target/installed/bin/dial --captures target/pty-captures/contention
          python3 examples/benchmarks/side_lifecycle_smoke.py --dial target/installed/bin/dial --captures target/pty-captures/side-lifecycle
      - name: Record runtime overhead
        if: matrix.os != (vars.DIAL_MACOS_INTEL_RUNNER || 'macos-15-intel')
        continue-on-error: true
        run: cargo run --locked --profile ci --example runtime_baseline -- target/runtime-baseline.json
      - name: Preserve runtime baseline
        if: always() && matrix.os != (vars.DIAL_MACOS_INTEL_RUNNER || 'macos-15-intel')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-baseline-${{ matrix.os }}
          path: target/runtime-baseline.json
      - name: Preserve terminal failure evidence
        if: failure() && matrix.os != (vars.DIAL_MACOS_INTEL_RUNNER || 'macos-15-intel')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-${{ matrix.os }}
          path: target/pty-captures
  lint:
    name: Clippy (${{ matrix.os }}) and dependency policy
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust and Clippy
        run: |
          rustup show active-toolchain
          rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        if: runner.os == 'Linux'
        with:
          command: check
          command-arguments: advisories licenses bans sources

  musl:
    # Release builds ship musl binaries; check them on every push so target-specific type
    # differences (for example libc's ioctl request type) fail here, not at publish time.
    name: musl check (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl toolchain
        env:
          CHECK_TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup show active-toolchain
          rustup target add "$CHECK_TARGET"
          echo "CC_${CHECK_TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: musl-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check
        run: cargo check --locked --profile ci -p dial --target "${{ matrix.target }}"

  python:
    name: Python tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/requirements-ci.lock
      - run: make test-python PYTHON=python
      - name: Benchmark graders and repeated-trial reporting
        run: make test-bench-offline PYTHON=python
  docker:
    name: Container image
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: DIAL_BUILD_REVISION=${{ github.sha }}
          load: true
          tags: dial:ci
          cache-from: type=gha,scope=docker
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=docker,mode=max' || '' }}
      - name: Smoke test
        run: |
          docker run --rm dial:ci --version
          docker run --rm dial:ci --help >/dev/null
      - name: Validate compose file
        run: docker compose config --quiet
  installer-windows:
    name: Windows installer (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-2025
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test install.ps1
        run: ./scripts/test-install.ps1
  windows-rust:
    name: Windows Rust contract
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test contract runner selection and empty-filter rejection
        run: python scripts/test-windows-contract.py
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-contract
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Focused native suite with a tracked exclusion list: scripts/windows-contract.txt.
      - name: Run focused Windows contract suite
        run: python scripts/windows-contract.py --profile ci

  linux-features:
    name: Linux feature checks
    needs: validate
    uses: ./.github/workflows/linux-features.yml
    with:
      exhaustive: false
