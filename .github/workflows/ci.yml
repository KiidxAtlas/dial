name: CI
on:
  push:
    branches: [main]
    # Documentation-only changes skip CI. Only root-level and docs/ Markdown is ignored: Markdown
    # under crates/ is compiled in with include_str! and must still trigger builds.
    paths-ignore: ['docs/**/*.md', '*.md', '.github/pull_request_template.md']
  pull_request:
    paths-ignore: ['docs/**/*.md', '*.md', '.github/pull_request_template.md']

permissions:
  contents: read

# A newer push to the same PR supersedes its running checks. Pushes to main each finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, build, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux
      - name: Install terminal fixture and OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        run: |
          command -v tmux || brew install tmux
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test embedded driver contracts
        run: make test-drivers
      - name: Install Rust
        # Honor rust-toolchain.toml instead of downloading an unrelated moving stable toolchain.
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test-${{ matrix.os }}
      - name: Test terminal installer
        run: bash scripts/test-install.sh
      - name: Test local build and update commands
        run: python3 scripts/test-build.py
      - name: Test focused Windows contract runner
        run: python3 scripts/test-windows-contract.py
      - name: Check packaging metadata consistency
        run: python3 scripts/test-packaging.py && python3 scripts/check-packaging.py
      - name: Verify Linux sandbox enforcement
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: cargo test --locked --profile ci --workspace linux_sandbox_enforces_filesystem_and_both_network_modes
      - name: Format
        run: cargo fmt --check
      - name: Build
        # The `dial` library and its unit-test build each peak near 5 GB in rustc. Built together
        # they exceed the 7 GB macOS arm64 runner and swap (11-16 min); one at a time they fit.
        # Workspace crates (crates/dial-*) are built one lib target at a time for the same reason.
        # The `ci` profile drops debug info, which cuts rustc memory, link time and cache size.
        run: |
          cargo build --locked --profile ci --workspace --lib
          cargo test --locked --profile ci --workspace --lib --no-run
          cargo build --locked --profile ci --workspace --all-targets
      - name: Test
        # Parallel: tests that change process HOME/PATH hold a shared lock; process fixtures set
        # their environment per child. Serial execution made the lib tests ~4x slower.
        run: make test-rust TEST_PROFILE=ci
      - name: Check slim build
        run: cargo check --locked --profile ci --no-default-features -p dial --bin dial
      - name: Install executable and verify artifact contracts
        timeout-minutes: 10
        run: |
          cargo install --locked --path . --profile ci --root target/installed
          make test-smoke DIAL=target/installed/bin/dial
      - name: Real terminal and crash lifecycle
        timeout-minutes: 5
        run: python3 examples/benchmarks/interactive_smoke.py --dial target/installed/bin/dial --captures target/pty-captures
      - name: Record runtime overhead
        continue-on-error: true
        run: cargo run --locked --profile ci --example runtime_baseline -- target/runtime-baseline.json
      - name: Preserve runtime baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-baseline-${{ matrix.os }}
          path: target/runtime-baseline.json
      - name: Preserve terminal failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminal-${{ matrix.os }}
          path: target/pty-captures
  lint:
    name: Clippy and dependency policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust and Clippy
        run: |
          rustup show active-toolchain
          rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          command-arguments: advisories licenses bans sources

  python:
    name: Python tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest fastapi==0.141.1 pydantic uvicorn
      - run: make test-python PYTHON=python
      - name: Benchmark graders and repeated-trial reporting
        run: make test-bench-offline PYTHON=python
  installer-windows:
    name: Windows installer (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test install.ps1
        run: ./scripts/test-install.ps1
  windows-rust:
    name: Windows Rust contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test contract runner selection and empty-filter rejection
        run: python scripts/test-windows-contract.py
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-contract
      # Focused native suite with a tracked exclusion list: scripts/windows-contract.txt.
      - name: Run focused Windows contract suite
        run: python scripts/windows-contract.py --profile ci
