name: Container image
# Builds the source Dockerfile only when container inputs change; every CI run building it took
# about ten minutes. The release workflow builds and smoke-tests the published image itself.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.release
      - .dockerignore
      - docker-compose.yml
      - docker-compose.sandbox.yml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.release
      - .dockerignore
      - docker-compose.yml
      - docker-compose.sandbox.yml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  docker:
    name: Container image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: DIAL_BUILD_REVISION=${{ github.sha }}
          load: true
          tags: dial:ci
          cache-from: type=gha,scope=docker
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=docker,mode=max' || '' }}
      - name: Smoke test
        run: |
          docker run --rm dial:ci --version
          docker run --rm dial:ci --help >/dev/null
      - name: Validate compose file
        run: docker compose config --quiet
