# Agent CLIs compared by cross_agent.py. Each argument is substituted separately (no shell):
# {model}, {thinking}, {timeout} (seconds) and {prompt}. `follow_up` continues the latest session
# in the trial's own fixture directory. Both agents run with their installed user configuration,
# including opt-in features such as Dial's `experimental.turn_optimizer` (one extra auxiliary
# request per user turn); the report records each agent's command and environment.
# Without --thinking, Dial applies Claude's catalog default (adaptive) thinking, so both agents
# receive the same {thinking} level. Dial accepts `--thinking off` for Anthropic without a model
# profile; other levels need a [model_profiles] entry declaring reasoning_efforts.
# Optional per-agent `env` (string values; `{work_root}`, `~` and `$VAR` expand) can isolate state,
# for example `env = { DIAL_HOME = "{work_root}/dial-home", DIAL_SUBSCRIPTION_AUTH_HOME = "~/.dial" }`
# runs Dial with a default configuration while sharing the signed-in subscription.

[[agents]]
name = "dial"
version = ["dial", "--version"]
output = "dial-json"
first = ["dial", "-p", "--output-format", "json", "--yes", "--provider", "anthropic", "--model", "{model}",
         "--endpoint", "https://api.anthropic.com/v1", "--thinking", "{thinking}", "--max-time", "{timeout}", "{prompt}"]
follow_up = ["dial", "-p", "-c", "--output-format", "json", "--yes", "--provider", "anthropic", "--model", "{model}",
             "--endpoint", "https://api.anthropic.com/v1", "--thinking", "{thinking}", "--max-time", "{timeout}", "{prompt}"]
# Dial's result usage comes from the session ledger, which includes worker requests.
delegated_usage = "included"

# Calls to `delegation_tools` (default ["task"]) mark a trial's usage incomplete unless
# `delegated_usage = "included"`: omp's print-mode JSON is not known to report subagent requests.
[[agents]]
name = "omp"
version = ["omp", "--version"]
output = "omp-json"
first = ["omp", "-p", "--mode", "json", "--auto-approve", "--model", "anthropic/{model}",
         "--thinking", "{thinking}", "--max-time", "{timeout}", "{prompt}"]
follow_up = ["omp", "-p", "-c", "--mode", "json", "--auto-approve", "--model", "anthropic/{model}",
             "--thinking", "{thinking}", "--max-time", "{timeout}", "{prompt}"]
# `omp --help` (18.13.2) lists `task` as its sub-agent tool.
delegation_tools = ["task"]
