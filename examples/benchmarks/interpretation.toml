version = 1
name = "interpretation-offline-v1"

# Synthetic evaluation: acceptance contracts, not a measured model-quality claim.

[[cases]]
id = "requirements-revisions"
project = "examples/benchmarks/interpretation-fixture"
prompt = "Compare requirements-v1.md against requirements-format.md and requirements-v2.md. Classify each revision and report changed requirement IDs. Write answer.json with keys format_only (boolean), format_changed_ids (list), substantive_changed_ids (list), retention_days_before and retention_days_after (integers). Do not modify input fixtures."
categories = ["documents", "requirements", "revision"]
checks = [{kind="command",command="python3 -c 'import json; from pathlib import Path; actual=json.loads(Path('\"'\"'answer.json'\"'\"').read_text()); expected=json.loads('\"'\"'{\"format_only\": true, \"format_changed_ids\": [], \"substantive_changed_ids\": [\"R1\"], \"retention_days_before\": 30, \"retention_days_after\": 90}'\"'\"'); assert json.dumps(actual,sort_keys=True)==json.dumps(expected,sort_keys=True), '\"'\"'answer does not meet value/type/coverage contract'\"'\"''"}]

[[cases]]
id = "full-dataset-outlier"
project = "examples/benchmarks/interpretation-fixture"
prompt = "Analyze all rows of measurements.csv, not just a preview. Write answer.json with integer keys rows_examined, sum, maximum, and string key maximum_id. Include every data row, excluding the header. Do not modify input fixtures."
categories = ["data", "coverage", "outlier"]
checks = [{kind="command",command="python3 -c 'import json; from pathlib import Path; actual=json.loads(Path('\"'\"'answer.json'\"'\"').read_text()); expected=json.loads('\"'\"'{\"rows_examined\": 150, \"sum\": 11490, \"maximum\": 10000, \"maximum_id\": \"R137\"}'\"'\"'); assert json.dumps(actual,sort_keys=True)==json.dumps(expected,sort_keys=True), '\"'\"'answer does not meet value/type/coverage contract'\"'\"''"}]

[[cases]]
id = "mixed-time-units"
project = "examples/benchmarks/interpretation-fixture"
prompt = "Normalize durations.csv to milliseconds. Write answer.json with integer total_ms and fastest_id/slowest_id strings. Compare normalized durations, not raw numeric values. Do not modify input fixtures."
categories = ["data", "units", "time"]
checks = [{kind="command",command="python3 -c 'import json; from pathlib import Path; actual=json.loads(Path('\"'\"'answer.json'\"'\"').read_text()); expected=json.loads('\"'\"'{\"total_ms\": 4500, \"fastest_id\": \"C\", \"slowest_id\": \"D\"}'\"'\"'); assert json.dumps(actual,sort_keys=True)==json.dumps(expected,sort_keys=True), '\"'\"'answer does not meet value/type/coverage contract'\"'\"''"}]

[[cases]]
id = "exact-decimal-money"
project = "examples/benchmarks/interpretation-fixture"
prompt = "Sum all amounts in money.csv exactly without binary floating point. Write answer.json with currency and total strings, preserving exactly two decimal places; include rows_examined as an integer. Do not modify input fixtures."
categories = ["data", "decimal", "money"]
checks = [{kind="command",command="python3 -c 'import json; from pathlib import Path; actual=json.loads(Path('\"'\"'answer.json'\"'\"').read_text()); expected=json.loads('\"'\"'{\"currency\": \"USD\", \"total\": \"9007199254740993.30\", \"rows_examined\": 4}'\"'\"'); assert json.dumps(actual,sort_keys=True)==json.dumps(expected,sort_keys=True), '\"'\"'answer does not meet value/type/coverage contract'\"'\"''"}]

[[cases]]
id = "contradictory-quotes"
project = "examples/benchmarks/interpretation-fixture"
prompt = "Using source-a.txt, source-b.txt and source-register.json, decide whether the supplied sources establish launch approval. Write answer.json with status (resolved or unresolved), approved (boolean or null), and quotes: a list in source filename order of objects with source and exact quote. Preserve both opposing launch sentences verbatim. Do not choose an authority absent from the register. Do not modify input fixtures."
categories = ["evidence", "ambiguity", "contradiction"]
checks = [{kind="command",command="python3 -c 'import json; from pathlib import Path; actual=json.loads(Path('\"'\"'answer.json'\"'\"').read_text()); expected=json.loads('\"'\"'{\"status\": \"unresolved\", \"approved\": null, \"quotes\": [{\"source\": \"source-a.txt\", \"quote\": \"The launch is approved for March 4.\"}, {\"source\": \"source-b.txt\", \"quote\": \"The launch is not approved for March 4.\"}]}'\"'\"'); assert json.dumps(actual,sort_keys=True)==json.dumps(expected,sort_keys=True), '\"'\"'answer does not meet value/type/coverage contract'\"'\"''"}]

[[cases]]
id = "nested-json-jsonl"
project = "examples/benchmarks/interpretation-fixture"
prompt = "Analyze nested.json and events.jsonl. Sum quantity for SKU X across every nested batch/order/line. Normalize non-null event durations to milliseconds; null means missing, not zero. Write answer.json with integer keys x_quantity, orders_examined, events_examined, events_with_duration, total_duration_ms and a missing_duration_ids list. Do not modify input fixtures."
categories = ["data", "nested_json", "jsonl", "coverage"]
checks = [{kind="command",command="python3 -c 'import json; from pathlib import Path; actual=json.loads(Path('\"'\"'answer.json'\"'\"').read_text()); expected=json.loads('\"'\"'{\"x_quantity\": 5, \"orders_examined\": 2, \"events_examined\": 3, \"events_with_duration\": 2, \"total_duration_ms\": 2250, \"missing_duration_ids\": [\"E3\"]}'\"'\"'); assert json.dumps(actual,sort_keys=True)==json.dumps(expected,sort_keys=True), '\"'\"'answer does not meet value/type/coverage contract'\"'\"''"}]

[[cases]]
id = "spreadsheet-cache-boundary"
project = "examples/benchmarks/interpretation-fixture"
prompt = "Inspect formula-cache.xlsx Totals!A3 without claiming a spreadsheet-engine recalculation. Write answer.json with cell (Sheet!coordinate), formula (without leading =), cached_value as a string, cache_verified as a boolean, and independently_computed_value as a string for the simple arithmetic expression. A cache alone does not prove verification. Do not modify input fixtures."
categories = ["spreadsheet", "formula_cache", "uncertainty"]
checks = [{kind="command",command="python3 -c 'import json; from pathlib import Path; actual=json.loads(Path('\"'\"'answer.json'\"'\"').read_text()); expected=json.loads('\"'\"'{\"cell\": \"Totals!A3\", \"formula\": \"A1+A2\", \"cached_value\": \"999\", \"cache_verified\": false, \"independently_computed_value\": \"3\"}'\"'\"'); assert json.dumps(actual,sort_keys=True)==json.dumps(expected,sort_keys=True), '\"'\"'answer does not meet value/type/coverage contract'\"'\"''"}]

[[cases]]
id = "ambiguous-transcription-double"
project = "examples/benchmarks/interpretation-fixture"
prompt = "Read transcript-double.json. It is a synthetic transcription double, not a recording. Do not invent a resolved day or claim live transcription. Write answer.json with kind (copied from input), live_audio_processed (boolean), resolved_day (string or null), alternatives (list), segment_id, and start_seconds/end_seconds (numbers) preserving the ambiguous segment interval. Do not modify input fixtures."
categories = ["audio_double", "ambiguity", "uncertainty"]
checks = [{kind="command",command="python3 -c 'import json; from pathlib import Path; actual=json.loads(Path('\"'\"'answer.json'\"'\"').read_text()); expected=json.loads('\"'\"'{\"kind\": \"synthetic_transcription_double\", \"live_audio_processed\": false, \"resolved_day\": null, \"alternatives\": [\"Tuesday\", \"Thursday\"], \"segment_id\": \"S1\", \"start_seconds\": 1.0, \"end_seconds\": 2.5}'\"'\"'); assert json.dumps(actual,sort_keys=True)==json.dumps(expected,sort_keys=True), '\"'\"'answer does not meet value/type/coverage contract'\"'\"''"}]

[[cases]]
id = "scanned-document-boundary"
project = "examples/benchmarks/interpretation-fixture"
prompt = "Read scan-boundary.json. This is only a synthetic boundary manifest; no scanned document or OCR result is supplied. Does empty extracted text establish an empty page? Write answer.json with page (integer), page_is_empty (boolean or null), ocr_status (copied), scan_processed (boolean) and extracted_claims (list). Do not invent OCR content. Do not modify input fixtures."
categories = ["scan_boundary", "coverage", "uncertainty"]
checks = [{kind="command",command="python3 -c 'import json; from pathlib import Path; actual=json.loads(Path('\"'\"'answer.json'\"'\"').read_text()); expected=json.loads('\"'\"'{\"page\": 1, \"page_is_empty\": null, \"ocr_status\": \"not_run\", \"scan_processed\": false, \"extracted_claims\": []}'\"'\"'); assert json.dumps(actual,sort_keys=True)==json.dumps(expected,sort_keys=True), '\"'\"'answer does not meet value/type/coverage contract'\"'\"''"}]
