# Local-only profile for the release slice (release-slice.toml). allow_remote=false: nothing here
# may send inference off the machine. Replace the placeholder with the exact ID of a model that is
# already loaded in LM Studio; no model availability is assumed or guessed.
# Plan the commands with: python3 examples/benchmarks/release_slice.py --profile local
[machine]
repetitions = 3
case_timeout_secs = 300
minimum_correctness = 1.0
allow_remote = false

[[configurations]]
name = "local-loaded"
provider = "lm-studio"
model = "REPLACE_WITH_LOADED_MODEL_ID"
context_window = 32768
