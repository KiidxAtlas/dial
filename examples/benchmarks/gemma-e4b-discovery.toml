version = 1
name = "gemma-e4b-discovery-diagnostic"

[[cases]]
id = "deferred-tool-discovery"
project = "examples/benchmarks/local-tasks-fixture"
prompt = "ast_edit is a deferred tool. Use tool_search to find and load it, then use it to change the cap in bounded_total in ledger.py from 100 to 250, leaving the rest of the file unchanged, and reply DONE."
categories = ["deferred_discovery"]
checks = [
  {kind="command", command='''python3 -c "import ledger; assert ledger.bounded_total([300]) == 250 and ledger.bounded_total([7, 3]) == 10 and ledger.total([200]) == 200; assert open('ledger.py').read().count('250') == 1"'''},
  {kind="response_equals", content="DONE"},
  {kind="tool_invoked", tool="tool_search"},
  {kind="tool_invoked", tool="ast_edit"},
]
