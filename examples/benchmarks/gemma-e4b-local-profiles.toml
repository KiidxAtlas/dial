# One bounded baseline repetition against an already-loaded LM Studio model.
# A loopback LM Studio server may proxy inference to another device; verify its loaded model first.
[machine]
repetitions = 1
case_timeout_secs = 120
minimum_correctness = 1.0
allow_remote = false

[[configurations]]
name = "gemma-e4b"
provider = "lm-studio"
model = "google/gemma-4-e4b"
context_window = 65536
